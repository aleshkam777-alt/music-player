<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music Collection</title>
  <script src="//telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--tg-theme-bg-color, #121212); color: var(--tg-theme-text-color, #fff); padding: 16px; padding-bottom: 110px; }
    h1 { font-size: 22px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .album-card { background: var(--tg-theme-secondary-bg-color, #1e1e1e); border-radius: 12px; padding: 10px; cursor: pointer; }
    .album-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; margin-bottom: 8px; background: #333; }
    .album-title { font-size: 15px; font-weight: 600; word-break: break-word; }
    #album-view { display: none; }
    .back-btn { background: none; border: none; color: var(--tg-theme-link-color, #3390ec); font-size: 16px; font-weight: 600; margin-bottom: 16px; cursor: pointer; }
    .album-header { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
    .album-header img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: #333; }
    .track-list { display: flex; flex-direction: column; gap: 8px; }
    .track-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--tg-theme-secondary-bg-color, #1e1e1e); border-radius: 10px; cursor: pointer; gap: 10px; }
    .track-item.active { border: 1px solid var(--tg-theme-button-color, #3390ec); }
    .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--tg-theme-secondary-bg-color, #1c1c1e); border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; display: none; flex-direction: column; gap: 8px; }
    .player-top { display: flex; justify-content: space-between; align-items: center; }
    .controls { display: flex; gap: 14px; }
    .ctrl-btn { background: var(--tg-theme-button-color, #3390ec); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    input[type="range"] { width: 100%; }
    .loader { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div id="home-view">
    <h1>Моя коллекция</h1>
    <div id="status" class="loader">Загрузка альбомов...</div>
    <div class="grid" id="albums-grid"></div>
  </div>
  <div id="album-view">
    <button class="back-btn" onclick="showHome()">← Назад к альбомам</button>
    <div class="album-header">
      <img id="current-cover" src="">
      <h2 id="current-title" style="font-size: 20px;"></h2>
    </div>
    <div class="track-list" id="track-list"></div>
  </div>
  <div class="player-bar" id="player-bar">
    <div class="player-top">
      <div style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 60%;">
        <div id="p-title" style="font-size: 14px; font-weight: 600;"></div>
        <div id="p-artist" style="font-size: 12px; color: #aaa;"></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
      </div>
    </div>
    <input type="range" id="progress" value="0" min="0" max="100" oninput="seek(this.value)">
  </div>
  <audio id="audio"></audio>
  <script>
    if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }

    const USER = "aleshkam777-alt";
    const REPO = "music-player";
    const API = ["https:", "", "api.github.com", "repos", USER, REPO, "contents", ""].join("/");
    let albums = [];
    let curAlb = 0, curTr = 0;
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-pause-btn');

    async function loadCollection() {
      try {
        const res = await fetch(API);
        const items = await res.json();
        const folders = items.filter(item => item.type === 'dir');

        if (folders.length === 0) {
          document.getElementById('status').innerText = 'Пока нет альбомов. Создайте папку на GitHub и загрузите туда треки!';
          return;
        }

        for (const folder of folders) {
          const fRes = await fetch(folder.url);
          const files = await fRes.json();
          const img = files.find(f => /\.(jpg|jpeg|png|webp)$/i.test(f.name));
          const mp3s = files.filter(f => /\.(mp3|m4a|wav|ogg)$/i.test(f.name));

          if (mp3s.length > 0) {
            albums.push({
              title: folder.name,
              cover: img ? img.download_url : '',
              tracks: mp3s.map(m => ({
                title: m.name.replace(/\.[^/.]+$/, ""),
                url: m.download_url
              }))
            });
          }
        }
        document.getElementById('status').style.display = 'none';
        renderAlbums();
      } catch (e) {
        document.getElementById('status').innerText = 'Ошибка загрузки. Проверьте интернет.';
      }
    }

    function renderAlbums() {
      document.getElementById('albums-grid').innerHTML = albums.map((a, i) =>
        '<div class="album-card" onclick="openAlbum(' + i + ')">' +
          '<img class="album-cover" src="' + a.cover + '">' +
          '<div class="album-title">' + a.title + '</div>' +
        '</div>'
      ).join('');
    }

    function openAlbum(i) {
      curAlb = i;
      const a = albums[i];
      document.getElementById('current-cover').src = a.cover;
      document.getElementById('current-title').innerText = a.title;
      renderTracks();
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('album-view').style.display = 'block';
    }

    function renderTracks() {
      document.getElementById('track-list').innerHTML = albums[curAlb].tracks.map((t, i) =>
        '<div class="track-item ' + ((!audio.paused && curTr === i) ? 'active' : '') + '" onclick="playTrack(' + i + ')">' +
          '<div>' + (i + 1) + '. ' + t.title + '</div><span>▶</span>' +
        '</div>'
      ).join('');
    }

    function showHome() {
      document.getElementById('album-view').style.display = 'none';
      document.getElementById('home-view').style.display = 'block';
    }

    function playTrack(i) {
      curTr = i;
      const a = albums[curAlb], t = a.tracks[i];
      audio.src = t.url;
      audio.play();
      document.getElementById('player-bar').style.display = 'flex';
      document.getElementById('p-title').innerText = t.title;
      document.getElementById('p-artist').innerText = a.title;
      playBtn.innerText = '⏸';
      renderTracks();
    }

    function togglePlay() {
      if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
      else { audio.pause(); playBtn.innerText = '▶'; }
    }

    function nextTrack() { playTrack((curTr + 1) % albums[curAlb].tracks.length); }
    function prevTrack() { const l = albums[curAlb].tracks.length; playTrack((curTr - 1 + l) % l); }

    audio.ontimeupdate = () => { if (audio.duration) document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100; };
    audio.onended = () => nextTrack();
    function seek(v) { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; }

    loadCollection();
  </script>
</body>
</html>
